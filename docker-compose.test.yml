# Local test services, mirroring the CI services in .github/workflows/ci.yml.
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peterjurco_test
    ports:
      - "5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peterjurco_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible store standing in for R2 in the presign/upload integration
  # tests (tests/media.presign.e2e.test.ts) — the presigner points here via
  # R2_ENDPOINT. The test bucket is created by the test setup over the S3 API.
  minio:
    # RustFS, not MinIO: MinIO pulled its public images from both Docker Hub
    # and quay.io (pull denied / unauthorized), so the service keeps its
    # `minio` name and the tests' minioadmin credentials but runs a
    # maintained S3-compatible server. Pinned — an unpinned `latest` is how
    # the previous two images vanished from under CI. If you ran the old
    # MinIO container, reset its stale volume once (RustFS runs unprivileged):
    #   docker compose -f docker-compose.test.yml rm -sfv minio
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Disposable MySQL-compatible DB standing in for a real WordPress export in
  # the migrate-wp tests (tests/migrate-wp/*) — the test suite creates its own
  # minimal wp_posts/wp_terms/wp_term_taxonomy/wp_term_relationships/
  # wp_postmeta tables and seeds fixture rows itself (see
  # tests/helpers/test-wp-db.ts); this service only provides the empty server.
  wp-mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp_migrate_test
    ports:
      - "3316:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serves the Neon serverless HTTP protocol in front of the plain Postgres
  # service so the production neon-http driver works in the dev-server health
  # test (see src/db/client.ts).
  neon-http-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/peterjurco_test
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
